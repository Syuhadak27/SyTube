name: Build & Release

on:
  push:
    branches:
      - main
      - master
      # dev builds a parallel "SyTube Dev" app (applicationId com.sytube.dev) and publishes it
      # to the rolling prerelease tag `dev-latest`; it never touches the stable release channel.
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Stable and dev build in parallel; each branch has its own release channel.
  group: sytube-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install NDK and profgen
        run: |
          set -euo pipefail
          NDK_VERSION="21.0.6113669"
          CMDLINE_TOOLS_VERSION="23.0"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmdline-tools;$CMDLINE_TOOLS_VERSION" > /dev/null
          profgen="$ANDROID_HOME/cmdline-tools/$CMDLINE_TOOLS_VERSION/bin/profgen"
          test -x "$profgen"
          echo "PROFGEN=$profgen" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine and bump version
        id: version
        shell: bash
        run: python3 tools/ci_version.py

      - name: Commit version bump and tag
        if: steps.version.outputs.bump == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sytube.properties CHANGELOG.md CHANGELOG.es.md || true
          git commit -m "Release ${TAG} [skip ci]" || echo "No changes to commit"
          git tag -a "${TAG}" -m "Release ${TAG}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Build release APKs
        shell: bash
        env:
          IS_DEV: ${{ steps.version.outputs.is_dev }}
          DEV_VERSION_CODE: ${{ steps.version.outputs.dev_version_code }}
          DEV_VERSION_NAME: ${{ steps.version.outputs.dev_version_name }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$IS_DEV" = "true" ]; then
            EXTRA="-PdevBuild -PdevVersionCode=$DEV_VERSION_CODE -PdevVersionName=$DEV_VERSION_NAME"
          fi
          set +e
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileRelease \
            -PprofgenPath="$PROFGEN" $EXTRA 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            {
              echo '## Gradle build failed'
              echo '```'
              tail -n 250 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi
          mkdir -p dist
          cp smarttubetv/build/outputs/renamed_apks/stmobileRelease/SyTube_*.apk dist/
          ls -l dist

      - name: Generate update manifest
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IS_DEV: ${{ steps.version.outputs.is_dev }}
          DEV_VERSION_CODE: ${{ steps.version.outputs.dev_version_code }}
          DEV_VERSION_NAME: ${{ steps.version.outputs.dev_version_name }}
        run: |
          set -euo pipefail
          if [ "$IS_DEV" = "true" ]; then
            python3 tools/dev_manifest.py --dist dist --out dist/sytube.json
          else
            python3 tools/update_manifest.py --tag "$TAG" --dist dist --out dist/sytube.json
          fi
          cat dist/sytube.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyTube-${{ steps.version.outputs.tag }}
          path: dist/*

      - name: Create GitHub Release
        if: steps.version.outputs.is_dev != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SyTube ${{ steps.version.outputs.version }}
          files: |
            dist/*.apk
            dist/sytube.json
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rolling dev channel: a prerelease that is never "latest", so stable installs never see it.
      # The dev app points its updater here (BuildConfig.DEV_BUILD) and every run replaces the
      # assets and bumps the manifest's versionCode.
      - name: Create dev prerelease
        if: steps.version.outputs.is_dev == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: SyTube Dev (latest dev build)
          body: |
            Automated build from the `dev` branch.

            Install this once, then the dev app updates itself from this release.
          files: |
            dist/*.apk
            dist/sytube.json
          generate_release_notes: false
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
