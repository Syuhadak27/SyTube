# SyTube build identity.
#
# This is the single place to change the app package, label and version.
# smarttubetv/build.gradle only reads these values; the release workflow
# (tools/ci_version.py) updates them.
#
# Stable release (branch main, no -PdevBuild):
app.applicationId=com.sytube
app.name=SyTube
app.versionCode=12200
app.versionName=1.22.0

# Parallel dev app (branch dev, built with -PdevBuild):
# CI overrides versionCode/versionName per run (200000 + run number), so the
# values below are only the defaults for a local dev build.
dev.applicationId=com.sytube.dev
dev.name=SyTube Dev
dev.versionCode=200000
dev.versionName=1.22.0-dev
