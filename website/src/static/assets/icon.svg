<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient merah utama -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d5a"/>
      <stop offset="45%" stop-color="#d81e3a"/>
      <stop offset="100%" stop-color="#6b0416"/>
    </linearGradient>

    <!-- Glass white gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Rim light -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Tombol play glass -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Segitiga play -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d68"/>
      <stop offset="100%" stop-color="#a80f27"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="outerClip">
      <rect x="8" y="8" width="496" height="496" rx="116"/>
    </clipPath>
  </defs>

  <!-- Base rounded square merah -->
  <g filter="url(#shadow)">
    <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bgGrad)"/>
  </g>

  <!-- Overlay glass -->
  <g clip-path="url(#outerClip)">
    <ellipse cx="200" cy="40" rx="340" ry="180" fill="#ffffff" opacity="0.18" filter="url(#glassBlur)"/>
    <path d="M -50 380 Q 180 120 512 -20 L 512 -50 L -50 -50 Z" fill="url(#glassGrad)" opacity="0.55"/>
    <ellipse cx="350" cy="500" rx="300" ry="120" fill="#ffffff" opacity="0.12" filter="url(#glassBlur)"/>
    <rect x="8" y="8" width="496" height="496" filter="url(#grain)" opacity="0.6"/>
  </g>

  <!-- Rim light luar & dalam -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>
  <rect x="14" y="14" width="484" height="484" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Tombol play glass -->
  <g filter="url(#softShadow)">
    <rect x="96" y="146" width="320" height="220" rx="60" fill="url(#btnGrad)"/>
    <rect x="96" y="146" width="320" height="220" rx="60" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
    <rect x="96" y="146" width="320" height="220" rx="60" fill="url(#glassGrad)" opacity="0.3"/>
  </g>

  <!-- Highlight atas tombol -->
  <path d="M 110 156 Q 256 130 402 156 Q 400 168 256 172 Q 112 168 110 156 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Segitiga play -->
  <path d="M 218 196 L 218 316 L 322 256 Z" fill="url(#triGrad)" stroke="#8a0a1d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 224 204 L 224 240 L 250 222 Z" fill="#ffffff" opacity="0.5"/>
</svg>